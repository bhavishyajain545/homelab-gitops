controller:
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits:   { memory: 192Mi }
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true    # scraped by kube-prometheus-stack (observability-slo-stack)
dashboard:
  enabled: false       # the Argo CD UI already shows Rollout status
