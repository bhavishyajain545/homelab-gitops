controller:
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits:   { memory: 192Mi }
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false   # flip to true once kube-prometheus-stack CRDs exist
dashboard:
  enabled: false       # the Argo CD UI already shows Rollout status
