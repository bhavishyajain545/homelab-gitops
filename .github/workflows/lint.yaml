name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: "0.8.0"
  HELM_VERSION: "v4.3.1"
  K8S_VERSION: "1.36.0"

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: yamllint
        run: |
          pip install --quiet yamllint
          yamllint -c .yamllint.yaml .

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \n            -x -e SC1091 bootstrap/*.sh host/*.sh host/traefik/*.sh

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install kubeconform and helm
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | sudo tar xz -C /usr/local/bin kubeconform
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | sudo tar xz --strip-components=1 -C /usr/local/bin linux-amd64/helm

      - name: kubeconform - Argo CD Applications and plain manifests
        run: |
          KC=(kubeconform -strict -summary -kubernetes-version "$K8S_VERSION"
              -schema-location default
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json')
          "${KC[@]}" apps/ bootstrap/root-app.yaml
          kubectl kustomize workloads/rollouts-demo | "${KC[@]}" -

      - name: kubeconform - rendered Helm charts with our values
        run: |
          KC=(kubeconform -strict -summary -kubernetes-version "$K8S_VERSION" -ignore-missing-schemas
              -schema-location default
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json')
          helm repo add argo https://argoproj.github.io/argo-helm
          ARGOCD_CHART=$(yq '.spec.sources[0].targetRevision' apps/argocd.yaml)
          ROLLOUTS_CHART=$(yq '.spec.sources[0].targetRevision' apps/argo-rollouts.yaml)
          helm template argocd argo/argo-cd --version "$ARGOCD_CHART" -n argocd \
            -f platform/argocd/values.yaml | "${KC[@]}" -
          helm template argo-rollouts argo/argo-rollouts --version "$ROLLOUTS_CHART" -n argo-rollouts \
            -f platform/argo-rollouts/values.yaml | "${KC[@]}" -

      - name: chart versions in bootstrap and Applications match
        run: |
          app=$(yq '.spec.sources[0].targetRevision' apps/argocd.yaml)
          boot=$(grep -oP 'ARGOCD_CHART_VERSION:-\K[0-9.]+' bootstrap/common.sh)
          echo "apps/argocd.yaml=$app bootstrap=$boot"
          test "$app" = "$boot"
